<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>崩K崩 · běng-k-běng</title>
<style>
:root{
  --bg:#0b0e14; --panel:#12161f; --line:#262c39; --ink:#e8e6e3; --dim:#8b93a5;
  --gold:#e0b34d; --red:#e05a4f; --green:#57b894; --blue:#6fa8dc;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:radial-gradient(1200px 600px at 50% -10%,#182030 0%,var(--bg) 60%);
  color:var(--ink);font:14px/1.5 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  display:flex;flex-direction:column;min-height:100vh;
}
header{
  display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);
  background:rgba(10,13,19,.8);backdrop-filter:blur(6px);position:sticky;top:0;z-index:20;flex-wrap:wrap;
}
.brand{font-weight:700;letter-spacing:.5px}
.brand small{color:var(--dim);font-weight:400;margin-left:6px}
.stats{display:flex;gap:12px;color:var(--dim);font-size:13px}
.stats b{color:var(--gold);font-weight:600}
header .spacer{flex:1}
select,button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover,select:hover{border-color:var(--gold)}
main{flex:1;display:grid;grid-template-columns:1fr 300px;grid-template-rows:minmax(0,1fr);gap:0;min-height:0;overflow:hidden}
#arena{position:relative;padding:8px 16px;display:flex;align-items:center;justify-content:center;min-height:0}
#circle{position:relative;width:min(58vh,500px);aspect-ratio:1;margin:auto}
#center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;
  width:44%;padding:10px 8px;border-radius:14px;background:rgba(11,14,20,.78);
  border:1px solid rgba(255,255,255,.06);pointer-events:none;z-index:5}
#chant{font-size:19px;font-weight:700;letter-spacing:1px;min-height:26px;color:var(--gold);line-height:1.3}
#hint{color:var(--dim);font-size:11.5px;margin-top:6px;line-height:1.4}
.token{
  position:absolute;transform:translate(-50%,-50%);width:104px;padding:8px 6px;text-align:center;
  background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;
  transition:all .18s ease;cursor:default;user-select:none;
}
.token .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:19px;line-height:19px}
.token .qi{font-size:11px;color:var(--gold);height:15px;line-height:15px;overflow:hidden}
.token .act{height:24px;display:flex;align-items:center;justify-content:center;margin-top:2px;overflow:hidden}
.token .act img{width:22px;height:22px;border-radius:50%;display:block;background:rgba(255,255,255,.04)}
.token .mv{font-size:11px;color:var(--dim);height:15px;line-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.token.me{border-color:var(--gold);background:rgba(224,179,77,.10);box-shadow:0 0 0 1px rgba(224,179,77,.25)}
.token.dead{opacity:.28;filter:grayscale(1)}
.token.dead::after{content:"出局";position:absolute;inset:0;display:grid;place-items:center;
  font-size:20px;font-weight:700;color:var(--red);letter-spacing:4px}
.token.pick{border-color:var(--red);background:rgba(224,90,79,.16);
  box-shadow:0 0 0 1px rgba(224,90,79,.45),0 0 16px rgba(224,90,79,.25)}
.token.pick .nm{color:#ffb3ab}
.token.hot{cursor:pointer}
.token.hot:hover{border-color:var(--red);transform:translate(-50%,-50%) scale(1.05)}
.token .badge{position:absolute;top:-8px;right:-6px;background:var(--red);color:#fff;font-size:10px;
  font-weight:700;border-radius:10px;padding:1px 6px;display:none}
.token.hot .badge{display:block}
#logPanel{border-left:1px solid var(--line);background:rgba(8,10,15,.5);display:flex;flex-direction:column;min-height:0;overflow:hidden}
#logPanel h3{margin:0;padding:12px 14px;font-size:13px;color:var(--dim);border-bottom:1px solid var(--line)}
#log{flex:1;overflow:auto;min-height:0;list-style:none;margin:0;padding:8px 14px;font-size:12.5px}
#log li{padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.05);color:#c7ccd8}
#log li.bad{color:var(--red)} #log li.good{color:var(--green)} #log li.warn{color:var(--gold)}
footer{border-top:1px solid var(--line);background:rgba(10,13,19,.92);padding:8px 16px;
  display:flex;flex-direction:column;gap:6px;max-height:34vh;overflow:auto}
#tabs{display:flex;gap:6px;flex-wrap:wrap}
#tabs button{padding:5px 12px;font-size:13px}
#tabs button.on{border-color:var(--gold);color:var(--gold);background:rgba(224,179,77,.12)}
#actions{display:flex;gap:6px;flex-wrap:wrap;min-height:34px}
.chip{
  border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;
  background:var(--panel);display:inline-flex;gap:6px;align-items:center;
}
.chip:hover{border-color:var(--gold)}
.chip .ic{width:24px;height:24px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12)}
.pick .ic{width:16px;height:16px;border-radius:50%;vertical-align:-3px;margin-right:4px}
#arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.chip.cost b{color:var(--gold);font-weight:600}
.chip.off{opacity:.32;cursor:not-allowed}
.chip.sel{border-color:var(--blue);color:var(--blue)}
#picks{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--dim);min-height:26px}
.pick{border:1px solid var(--red);color:#ffb3ab;background:rgba(224,90,79,.10);border-radius:999px;padding:2px 8px}
#row{display:flex;gap:10px;align-items:center}
#go{padding:8px 22px;border-color:var(--gold);color:var(--gold);font-weight:600}
#go:disabled{opacity:.35;cursor:not-allowed}
#msg{color:var(--dim);font-size:12.5px}

/* ---------- 开场教程 ---------- */
.modal{position:fixed;inset:0;background:rgba(4,6,10,.86);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.hidden{display:none}
.modal-card{width:min(580px,94vw);max-height:90vh;overflow:auto;background:#12161f;border:1px solid var(--line);
  border-radius:16px;padding:16px 20px 14px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.tut-head{display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:12px}
.tut-head b{color:var(--gold);font-size:13px;letter-spacing:.5px}
.tut-body{min-height:230px;padding:12px 0 6px}
.tut-body h3{margin:0 0 10px;font-size:17px;color:var(--ink)}
.tut-body ul{margin:0;padding-left:18px;line-height:1.85;color:#c7ccd8;font-size:13.5px}
.tut-body li b{color:var(--gold)}
.tut-imgs{display:flex;gap:12px;margin-top:14px;justify-content:center}
.tut-imgs figure{margin:0;text-align:center;font-size:11px;color:var(--dim)}
.tut-imgs img{width:64px;height:64px;border-radius:50%;border:1px solid var(--line);background:#000;display:block;margin-bottom:4px}
.tut-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.dots{display:flex;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#2a3140}
.dot.on{background:var(--gold)}
.tut-foot .btns{display:flex;gap:8px}
.tut-foot button:disabled{opacity:.32;cursor:not-allowed}
#tutNext{border-color:var(--gold);color:var(--gold);font-weight:600;min-width:104px}
@media (max-width:860px){
  main{grid-template-columns:1fr;grid-template-rows:1fr auto}
  #circle{width:min(70vw,420px)}
  #logPanel{max-height:130px;border-left:none;border-top:1px solid var(--line)}
  .token{width:84px;padding:6px 4px}
  #chant{font-size:20px}
}
@media (max-width:520px){
  header{padding:6px 10px;gap:6px}
  .brand{font-size:13px}
  .brand small{display:none}
  .stats{gap:7px;font-size:11.5px;white-space:nowrap}
  header select,header button{padding:4px 7px;font-size:12px}
  #circle{width:min(84vw,330px)}
  .token{width:72px;padding:4px 3px;border-radius:10px}
  .token .nm{font-size:11px}
  .token .qi,.token .mv{font-size:9.5px;min-height:12px}
  .token.dead::after{font-size:15px;letter-spacing:2px}
  #center{width:41%;padding:7px 5px}
  #chant{font-size:15px;min-height:20px}
  #hint{font-size:9.5px;margin-top:3px}
  footer{padding:6px 10px;gap:4px;max-height:38vh}
  .chip{padding:4px 9px;font-size:11.5px}
  #go{padding:6px 16px;font-size:12.5px}
  #msg{font-size:11px}
  #logPanel{max-height:104px}
  #log{font-size:11px;padding:4px 10px}
}
</style>
</head>
<body>
<header>
  <div class="brand">beng·K·beng<small>崩K崩</small></div>
  <div class="stats">
    <span>第 <b id="roundLabel">1</b> 局</span>
    <span>存活 <b id="aliveLabel">8</b></span>
    <span>我 <b id="stageLabel">0 阶</b></span>
  </div>
  <div class="spacer"></div>
  <select id="players" title="人数">
    <option value="4">5 人</option>
    <option value="7" selected>8 人</option>
  </select>
  <select id="difficulty" title="人机难度">
    <option value="0">新手 AI</option>
    <option value="1" selected>老手 AI</option>
    <option value="2">高手 AI</option>
  </select>
  <button id="btnRules">规则</button>
  <button id="restart">重开一局</button>
</header>

<main>
  <section id="arena">
    <div id="circle">
      <div id="center">
        <div id="chant">准备</div>
        <div id="hint">先在下方选一个行动</div>
      </div>
    </div>
  </section>
  <aside id="logPanel">
    <h3>战报</h3>
    <ol id="log"></ol>
  </aside>
</main>

<footer>
  <div id="tabs">
    <button data-kind="attack" class="on">攻击</button>
    <button data-kind="defense">防御</button>
    <button data-kind="special">运气 / 自杀</button>
  </div>
  <div id="actions"></div>
  <div id="picks"></div>
  <div id="row">
    <button id="go" disabled>出招（Enter）</button>
    <button id="cancel">取消（Esc）</button>
    <span id="msg">一回合只做一件事：攻击 / 防御 / 运气</span>
  </div>
</footer>

<div id="tut" class="modal hidden">
  <div class="modal-card">
    <div class="tut-head">
      <b>崩K崩 · 30 秒上手</b>
      <button id="tutClose">跳过</button>
    </div>
    <div class="tut-body" id="tutBody"></div>
    <div class="tut-foot">
      <div class="dots" id="tutDots"></div>
      <div class="btns">
        <button id="tutPrev">上一步</button>
        <button id="tutNext">下一步</button>
      </div>
    </div>
  </div>
</div>

<script src="rules.js"></script>
<script src="ai.js"></script>
<script src="game.js"></script>
</body>
</html>
